# /etc/mosquitto/acl.conf — PHASE 1 (authentication), the shape that matches the client bytes on
# this branch. This is a REAL, LOADABLE file; docs/broker/acl.conf is the reading copy that
# explains both shapes and what each leaves open.
#
# STATUS: ARTIFACT ONLY — not applied to any live host. A lane writes it, the owner
# applies it. It IS loadable and IS loaded: src/tools/broker-fixture.sh starts the artifact's
# broker config with this file and src/tools/test_broker_auth.ts runs against it, so every claim
# below is something a broker did, not something this comment asserts.
#
# THE ROOM IS A NAME, NOT A SECRET. `tabith` is the project's room; the fixture substitutes it
# (s|chat/tabith|chat/fixture|g) so no test can touch the real room. That substitution is the ONLY
# edit the fixture makes to either artifact file.
#
# ---------------------------------------------------------------------------
# READS — everything a lane needs to hear, for any authenticated peer.
# ---------------------------------------------------------------------------
pattern read chat/tabith
pattern read chat/tabith/msg/+
pattern read chat/tabith/hist/+
pattern read chat/tabith/presence
pattern read chat/tabith/presence/+
pattern read chat/tabith/_ctl
pattern read chat/tabith/_ctl/#

# ---------------------------------------------------------------------------
# WRITES — and the honest limit of phase 1, stated where a reader will hit it.
# ---------------------------------------------------------------------------
# Any authenticated lane may write the FLAT room topic, because that is what the shipped clients
# do. Consequence, out loud: a lane holding a valid certificate can still put ANY nick in its
# JSON payload and the broker will carry it. Phase 1 closes STRANGERS (anonymous connect, forged
# presence from an unauthenticated peer, free $SYS recon, a steer from a peer with no certificate).
# It does NOT close LANES LYING ABOUT WHO THEY ARE — that is phase 2, which is
# `acl-generated.conf` from docs/broker/mint-tabichat-pki.sh, and it needs the client protocol
# change (single-write to chat/<room>/msg/<nick>) to go with it or every lane goes silent at once.
#
# So: LANE_ADMIN_COMPACT may ride on phase 1 (it interrupts a lane the broker admitted).
# LANE_ADMIN_SHUTDOWN must stay off until phase 2 is applied AND single-write is on, because a
# shutdown request is exactly the verb an impersonating payload can forge.
pattern write chat/tabith

# Presence is per-nick in the topic (`chat/<room>/presence/<nick>`, roommsg.ts:presenceTopic), and
# `%u` expands to the WHOLE subject DN — measured `CN=lead-agent`, not `lead-agent` — so a `%u` pattern CANNOT
# express "only your own presence leaf". Writing `pattern write chat/tabith/presence/%u` here would
# aim at chat/tabith/presence/CN=lead-agent, match nothing the client sends, and every lane would go
# invisible while the broker looked healthy. So phase 1 grants the subtree and says so:
pattern write chat/tabith/presence/+

# The receipt board is flat plus per-message-id retained children. Same `%u` limitation applies
# (ids are one leaf, keyed by message id, not by nick), so it is granted to authenticated peers:
pattern write chat/tabith/_ctl
pattern write chat/tabith/_ctl/#

# ---------------------------------------------------------------------------
# What this file therefore does NOT claim
# ---------------------------------------------------------------------------
# 1. It does not make authorship authoritative. The payload `nick` field is still self-asserted.
# 2. It does not stop one lane writing a receipt for another lane's message id.
# 3. It is not a substitute for `allow_anonymous false` on the listener — that flag is in
#    docs/broker/tabichat.conf, INSIDE the listener block, because with `per_listener_settings
#    true` a global `acl_file`/anonymous setting is a load error (measured, and the fixture
#    asserts a refusal on the TLS port for a credential-free connect).
