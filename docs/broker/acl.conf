# /etc/mosquitto/acl.conf — tabichat topic authority, and what each block does NOT close
#
# STATUS: ARTIFACT ONLY. Not applied to any live host. Same boundary as
# docs/broker/tabichat.conf: a lane writes this file, the owner applies it.
#
# THE USERNAME SIDE OF THIS FILE IS MEASURED, NOT ASSUMED. With
# `use_subject_as_username true` on the listener, mosquitto's username for a TLS client is the
# WHOLE subject DN of the verified client certificate, in mosquitto's RDN order. Measured on the
# loopback fixture: a /CN=<nick> subject became `CN=<nick>`; a /CN=<nick>/O=<org> subject became
# `O=<org>,CN=<nick>`. Every `user` line below is therefore `CN=<nick>`, and the matching
# NOTE: the two specimen names in that measurement are generic tokens, not one venue's roster — the
#   measured fact is the RDN ORDER, and it does not depend on which nick was on the wire that day.
# certificates are minted that way by docs/broker/mint-tabichat-pki.sh — a `user` line that does
# not equal the computed username is not an error at the broker, it is a lane that cannot publish
# and a report that reads like a network fault.
#
# THE FILE THE BROKER SHOULD BE GIVEN IS GENERATED, NOT THIS ONE. `mint-tabichat-pki.sh` writes
# `acl-generated.conf` with one block per nick it minted, so a nick cannot be in the cert set and
# missing from the ACL (or the reverse). This file is the READING COPY: it states the shapes, the
# ordering law, and what each shape leaves open. Paste the generated file; read this one.
#
# TWO SHAPES, AND WHY BOTH ARE HERE. The difference is not cosmetic: block 1 authenticates peers,
# block 2 makes the BROKER the authority on who said a line.

# ===========================================================================
# BLOCK 1 — phase 1: authentication, flat room topic (what the client bytes on THIS branch speak)
# ===========================================================================
#
# Every authenticated lane may write the flat room topic. Read this consequence out loud, because
# it is the honest limit of phase 1 and not a detail:
#
#   PHASE 1 CLOSES: a stranger on the LAN — anonymous connect, forged presence from an
#     unauthenticated peer, free `$SYS` reconnaissance, and a posted steer from a peer that has no
#     certificate at all.
#   PHASE 1 DOES NOT CLOSE: an AUTHENTICATED lane putting another nick in its payload. The client
#     still sends `nick` in the JSON, and `index.ts` still reads `msg.nick` as the sender and feeds
#     it to `deliveryClass()` and the steer allowlist. So `LANE_ADMIN_SHUTDOWN` must stay off after
#     block 1, and the design note's phase-1-is-a-precondition sentence is about block 2.
#
# pattern read    chat/tabith
# pattern read    chat/tabith/msg/+
# pattern read    chat/tabith/presence/+
# pattern read    chat/tabith/_ctl
# pattern read    chat/tabith/_ctl/#
# pattern write   chat/tabith
# pattern write   chat/tabith/presence/%u
# pattern write   chat/tabith/_ctl
#
# `pattern write chat/tabith/presence/%u` is the one line in block 1 that IS identity-bound — but
# `%u` there expands to `CN=<nick>`, so the topic leaf it produces is
# `chat/tabith/presence/CN=<nick>`, which is NOT the topic the client publishes
# (`presenceTopic()` in roommsg.ts builds `chat/<room>/presence/<nick>`). MEASURED CONSEQUENCE: a
# `%u` pattern can never express "the nick without the CN= prefix", so per-nick writes in this
# design are expressed with `user CN=<nick>` + `topic ... /<nick>` blocks, which is exactly what
# the generated file emits. A lane that copies the `%u` form above onto the box gets a broker that
# refuses every presence beat and prints nothing about why.

# ===========================================================================
# BLOCK 2 — phase 2: broker-enforced authorship, shape (B): recent messages stay stored on
# the server, no impersonation, with a lock. This is what the GENERATED acl-generated.conf contains, per nick:
# ===========================================================================
#
#   user CN=<nick>
#   topic readwrite chat/tabith/msg/<nick>
#   topic readwrite chat/tabith/hist/<nick>
#   topic readwrite chat/tabith/presence/<nick>
#   topic readwrite chat/tabith/_ctl
#
# PROVEN ON THE FIXTURE, both halves, not asserted from this text:
#   POSITIVE  a lane holding CN=<nick> publishes `chat/tabith/msg/<nick>` -> delivered, and a pinned
#             TLS subscriber receives it.
#   NEGATIVE  the SAME connection publishes `chat/tabith/msg/<other-nick>` -> the broker drops it; the
#             subscriber on `chat/tabith/#` never sees the line. Paired, own-topic green, so this
#             is not a broker that refuses everything and reads as secure.
#   NEGATIVE  a credential-free connect to the same listener -> refused ("peer did not return a
#             certificate"). A plaintext connection attempt to the TLS port -> refused.
#
# WHY BLOCK 2 IS NOT APPLIED IN THIS CHANGESET, and this is the ordering law, not a deferral:
# the client protocol change that goes with it (publish `chat/<room>/msg/<nick>` instead of the
# flat topic, dual-read both) touches index.ts, tabichat_cli.py and mqtt_tool.py at
# once. Applying block 2 while any of those still writes the flat topic makes that lane UNABLE TO
# POST, and it fails silently from the lane's side (the broker drops a QoS 0 publish with no
# error). The design row's migration law says the same thing in its own words: "dual-read,
# single-write ... Never a big-bang publish change across live lanes mid-round."
#
# The dual-read half of that migration is IN this changeset: the extension now subscribes
# `chat/<room>/msg/+` as well as the flat topic, and a line arriving on a `msg/<leaf>` topic takes
# its AUTHOR FROM THE TOPIC, not the payload, refusing the line when the two disagree. That is a
# safe addition because no client writes there yet. Single-write is the gated half
# (`MQTT_SENDER_TOPIC=1`, default off), and it must not be turned on until the broker is on block
# 2 and every lane is running these bytes.

# ===========================================================================
# What NEITHER block closes, and is therefore still owed
# ===========================================================================
# 1. Payload `nick` vs authenticated identity, for any lane still on the flat topic. That is the
#    row's core finding and it stays open until block 2 + single-write land together.
# 2. The receipt board, and the grant mismatch that block 2 CREATES (corrected after three
#    reviews read the artifact and one ran it; the sentence this replaces asserted the
#    opposite of what the generator emits, and it was wrong in the direction that hides a failure.
#    CLOSED IN SHAPE, NOT YET DEPLOYED — see the last paragraphs of this item.
#    `chat/<room>/_ctl/<message-id>` is keyed by id, and MQTT ACL patterns match whole levels only,
#    so `%u` cannot scope it. What block 2 ACTUALLY does is narrower than the old sentence said:
#    `mint-tabichat-pki.sh:157` emits `topic readwrite chat/<room>/_ctl`, which is an EXACT-MATCH
#    grant on the parent and therefore covers NO child, and `:138` emits `pattern read
#    chat/<room>/_ctl/#` — READ over the subtree, never write. So under block 2 a lane CANNOT write
#    its own receipt board entry, and it cannot write its lane-admin outcome at
#    `_ctl/admin/<id>` either. Both are QoS 0, so both are dropped with no error event, no socket
#    close and no broker-log line (measured on the loopback fixture at both phases, and the rule is
#    stated in the "ACL order can go silently wrong" section of `docs/tls-operations.md`:
#    silently — no denial in the log"). The publisher's own rc says nothing happened, and so does
#    the absence of anything else. That is worse, not better, than the hazard the old sentence was
#    warning about: at least under block 1, where `_ctl/#` WRITE is granted, a lane CAN write a
#    receipt for an id it does not own — the forgery the old text named, and it is a real limit —
#    whereas under block 2 the honest receipt disappears and the forgery path goes with it.
#    The client now refuses to let that be invisible: `roommsg.ts` watchAck/settleAck/expireAcks
#    plus the sweeper in `index.ts` treat a control-child publish that never echoes back to this
#    lane's own `_ctl/#` subscription as UNCONFIRMED delivery and say so loudly. That is a
#    detection, not a fix: it names the loss, it cannot grant the write.
#    The two candidate fixes were (a) grant the subtree for write as well and accept the foreign-id
#    write, or (b) move receipts under the sender (`_ctl/<nick>/<id>`) so a narrow grant can cover
#    them. THE 488 WORDING OF THIS PARAGRAPH READ "The real fixes, each a second protocol change, are
#    NOT done here" — kept here as the dated record, because a correction that deletes what it
#    corrected cannot be audited. It is superseded by the next two lines, not by silence. Option (b)
#    was chosen, and it is BUILT on the receipts-under-sender-grant branch — the compatibility cost
#    named in the proposal (an older peer that subscribes the flat shape stops seeing receipts) is the
#    half that was read and accepted, priced at a day.
#    What that branch changes, all measured on the loopback fixture (`src/tools/
#    test_ack_watch_broker.ts`), not asserted:
#      - `roommsg.ts:ackTopic(room, by, id)` -> `chat/<room>/_ctl/<nick>/<id>`, and
#        `laneadmin.ts:adminResultTopic(room, by, id)` -> `chat/<room>/_ctl/<nick>/admin/<id>`. The
#        nick goes through the SAME `sanitizeAckId` the id does, because a nick carrying `/`, `+` or
#        `#` would address a level it does not own.
#      - `mint-tabichat-pki.sh:166` emits `topic write chat/<room>/_ctl/<nick>/#`: a per-nick WRITE
#        leaf. Nothing emits `_ctl/#` write any more, which is the sentence block 1 was true of.
#      - Own leaf delivered, FOREIGN leaf refused — both directions, receipts and lane-admin answers.
#        Before this branch the cross-lane receipt write was structurally certain and exercised by NO
#        cell (a review finding); the phase-1 run now measures the forgery as DELIVERED, so
#        the hole is on the record as a fact about the running grant rather than an inference.
#      - The READ side did not move: every client already subscribes `chat/<room>/_ctl/#` and `#`
#        crosses levels, so a mixed fleet reads each other's shapes. The narrow grant is on the WRITE
#        only — which is exactly why the deploy order matters (see `docs/broker/README.md` cutover).
#      - Shape (b) costs a board that used to collapse: N lanes acking one message now occupy N
#        retained topics, so each lane clears its OWN aged leaves (`MQTT_ACK_RETAIN_MS`, default one
#        hour, backstop 256 entries per lane, a trim reported not silent). A lane with the ack
#        WATCHDOG turned off still clears — that was a leak found and fixed on this same branch.
# 3. `MQTT_LEAD_NICK` / `MQTT_STEER_NICKS` are lane-side checks over self-asserted input. They are
#    not an authentication boundary and must not be read as one — with block 1 applied they are
#    checks over a peer the broker admitted, which is better than today, and with block 2 they
#    become checks over a peer the broker identified.
# 4. The broker-auth design note names `crlfile` as optional belt-and-braces. There is
#    no CRL here: revocation today is "let the 90-day client cert expire", and a hard revoke needs
#    a CRL or an ACL edit + restart. Said because "rotation and revocation become a re-issue" is in
#    the design note and the re-issue is real but the INSTANT revoke is not.
