# acl-supplementary.conf — non-seat broker grants
#
# WHAT THIS FILE IS. docs/broker/mint-tabichat-pki.sh appends these lines VERBATIM to the end of the
# ACL it generates, under a provenance comment naming this file, and prints the path and the line
# count it appended. It is interpreted by nothing in this repo: the broker reads it, the script only
# copies it.
#
# WHY IT EXISTS. `acl-generated.conf` is rewritten from scratch on every mint and every renewal run,
# and the generator's per-nick blocks come from the roster. Before this file there was no place for an
# identity that is not a chat seat, so its grant lived only in the hand-installed ACL on the broker
# host — and the next regeneration deleted it, silently, with no error anywhere. The scheduled date of
# that loss was the client-leaf expiry, 6 Feb 2027.
#
# THE RULE THIS CLOSES: a grant belongs in this file or in the roster, never in a hand edit.
#
# WHAT IS IN IT — one identity.
#   operator — the weekly drain (fleet ruling R-2815) runs under this client leaf, and R-2816 (G4)
#     scopes it to the control subtree and NOTHING ELSE: it may clear a retained message that its own
#     seat leaf has no right to touch, and it may not post to the room. A drain publishes a ZERO-BYTE
#     retained payload; it never writes a JSON tombstone, which would falsely settle an ack watch.
#     Its leaf is minted with `add-leaf operator`, precisely because the block the roster would give
#     it — `topic readwrite chat/<room>/msg/<nick>` and the rest — is wider than this grant.
#   The chat seats, including the human client, belong in roster.txt instead, and their blocks are
#     generated there.
user CN=operator
topic write chat/+/_ctl/#
