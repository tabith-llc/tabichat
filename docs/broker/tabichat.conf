# /etc/mosquitto/conf.d/tabichat.conf — the phase-1 shape (AUTHENTICATION)
#
# STATUS: ARTIFACT ONLY. Nothing here has been applied to any live host.
# Applying it is the owner's act, not a lane's (features/tabichat-mqtt-broker-auth.md — the owner
# order of 2026-10-18 releases IMPLEMENTATION on a branch; the broker itself stays untouched).
#
# WHAT THIS CLOSES: anonymous CONNECT, on every listener. After this file is applied a peer that
# presents no certificate signed by the tabichat CA cannot reach the room at all, which shuts the
# stranger-injection and forged-presence class the feature row measures.
#
# WHAT THIS DOES NOT CLOSE, stated rather than averaged away: while lanes still publish to the
# FLAT room topic, an AUTHENTICATED lane can put any nick in its payload. Broker-enforced
# authorship is phase 2 (per-sender topics `chat/<room>/msg/<nick>` + the `%u` patterns in
# acl.conf), and that is a PROTOCOL change across three clients, deliberately not applied here —
# see the two blocks in acl.conf for the ordering and why block 2 is commented.
#
# TWO LOAD RULES MEASURED ON THE FIXTURE, both of which the design block in the feature row got
# WRONG, and both of which would have taken the room down if this file had been pasted from it:
#
#   1. With `per_listener_settings true`, `acl_file` in the GLOBAL block is a hard load error:
#        "Error: The 'acl_file' option requires a listener to be defined first."
#      The broker refuses to START. So `acl_file` and `allow_anonymous` live INSIDE the listener.
#   2. A COMMENT LINE MUST NOT BE INDENTED. Inside the listener block, `  # text` is parsed as a
#      configuration variable and dies:
#        "Error: Unknown configuration variable '#'."  (config line 49, at boot)
#      That is why every comment in this file sits at column 0 and the option lines under
#      `listener` carry no comments between them. Indentation reads as continuation of the
#      listener scope; a comment does not.
#
# Both came from `src/tools/broker-fixture.sh up` + `src/tools/test_broker_auth.ts` against the
# artifact's own bytes (paths substituted, nothing else edited). Results are in
# the leg's own encryption report, filed in the tabith workspace (not in this repo).
#
# VERSION PRE-FLIGHT (measured 2026-10-18, read-only, no mutation): the live broker answers
# `$SYS/broker/version` = `mosquitto version 2.0.21`. And THREE things the design block got wrong,
# each caught by starting these bytes on a loopback broker rather than by reading them:
#
#   1. `tls_version tls1.3` is not a value mosquitto accepts — it aborts with
#        "Error: Unsupported tls_version \"tls1.3\"."
#      The correct spelling is `tlsv1.3`, and that is what is below.
#   2. `tls_use_subject CN=%s` IS NOT A MOSQUITTO OPTION AT ALL — a broker given the design block
#      as written refuses to load:
#        "Error: Unknown configuration variable 'tls_use_subject'."
#      The real option is the BOOLEAN `use_subject_as_username true`, and it does something
#      different: the username becomes the ENTIRE subject DN, in mosquitto's own RDN order.
#      Measured on the fixture: a /CN=worker1 subject arrived as `CN=worker1`, a /CN=lead-agent/O=tabith
#      subject arrived as `O=tabith,CN=lead-agent` (the second RDN moved to the FRONT). So the design
#      (the specimen nicks are generic tokens; the measured fact is the RDN order, not a name).
#      row's pre-flight ("does mosquitto support mapping a client-cert subject to a username,
#      >= 2.0.12") resolves YES-WITH-CORRECTION, and the `password_file` contingency still does not
#      apply — but a subject must be ONE RDN for the ACL `user` line to be predictable, which is
#      why the mint script mints `CN=<nick>` and nothing more.
#   3. an INDENTED COMMENT inside a listener block is a load error ("Unknown configuration
#      variable '#'"), so every comment in this file is at column 0.
#
# The fixture that proves these bytes runs mosquitto 2.1.2; the fleet's broker is 2.0.21. Same two
# options, so a green fixture is evidence about the SHAPE and about the option NAMES, not about
# 2.0.21 byte-for-byte. Re-derive the version before applying:
#   mosquitto -h | head -1                   (on the broker host, the owner's act)
#   or from any client already able to reach it: read $SYS/broker/version
#
# AND ONE DEPRECATION, printed on the fixture at boot: 2.1.2 says `per_listener_settings` "is now
# deprecated and will be removed in version 3.0". On the fleet's 2.0.21 it is current. Once 1883
# is deleted there is exactly ONE listener, so the option stops being needed at all — it earns its
# place only during the migration window, when two listeners must not share a policy.

# Per-listener isolation, because during the migration window two listeners exist and they are not
# meant to share a policy. Consequence a lane can get wrong: with this on, a listener that is not
# given `allow_anonymous false` inherits nothing and is an ANONYMOUS listener.
per_listener_settings true

# ---------------------------------------------------------------------------
# 8883 — TLS + client certificates. This is the listener the fleet is meant to use.
# ---------------------------------------------------------------------------
listener 8883 0.0.0.0
# certfile/keyfile are the SERVER leaf issued by the same CA the clients pin, so the client
# verifies the broker and the broker verifies the client: mTLS, one trust root, no shared secret.
# These comments are at column 0 on purpose — an indented comment here is a LOAD ERROR, see rule 2
# at the top of this file.
certfile /etc/mosquitto/certs/tabichat-server.crt
keyfile  /etc/mosquitto/certs/tabichat-server.key
cafile   /etc/mosquitto/certs/tabichat-ca.crt
# The whole point of the file: a connect with no client certificate is refused, not downgraded.
require_certificate true
# The CN of the verified client cert BECOMES THE USERNAME, so an ACL `%u` is the authenticated
# identity rather than a string someone typed into a payload. No password file, no secret in any
# launch line. (mosquitto >= 2.0.12; this box measures 2.0.21.)
use_subject_as_username true
allow_anonymous false
acl_file /etc/mosquitto/acl.conf
tls_version tlsv1.3

# ---------------------------------------------------------------------------
# 1883 — plaintext. NOT CONFIGURED. It is deleted, not narrowed.
# ---------------------------------------------------------------------------
# Ruled, verbatim: "no. do not make 1883 localhost-only. permanently. we
# will fix phase 1 and then delete 1883 permantly." So there is deliberately no
# `listener 1883 127.0.0.1` stanza here, no commented-out escape hatch to paste, and no
# "keep it for the migration window" variant. An open anonymous port IS the defect re-opened,
# and under `per_listener_settings true` a listener that omits the anonymous flag bypasses the
# ACLs written for the other one.
#
# THE SEQUENCING CONSEQUENCE, which is the owner's to accept and this seat's to name: deleting
# 1883 and demanding client certificates is, for the fleet, the SAME ACT, because every lane
# today connects `mqtt://...:1883`. The order that does not strand a lane is:
#   1. the owner applies this file on a SECOND port (not 1883, not replacing 8883) while lanes
#      still use 1883;
#   2. the client half of THIS branch is deployed and lanes are restarted in one window;
#   3. the owner applies this file as 8883-only and deletes 1883.
# Steps 1 and 3 are the owner's. Step 2 is what this branch ships.
